    <script>
      // 火山的token
      window._volcToken = {}

      // 基础配置
      const baseOpts = {
        usid: "",
        deid: "",
      };

      (async () => {
        try {
          const getCookie = async (name) => {
            // 支持 cookieStore API 的浏览器，直接使用 cookieStore API 获取 cookie
            if("cookieStore" in window) return (await cookieStore.get(name))?.value;

            // 将cookie字符串拆分成键值对数组
            const cookiePairs = document.cookie.split('; ');
            
            // 创建对象来存储所有cookie
            const cookies = {};
            
            // 遍历所有cookie键值对
            for (const pair of cookiePairs) {
                // 跳过空字符串
                if (!pair) continue;
                
                // 将键值对拆分为键和值
                const [key, value] = pair.split('=');
                
                // 存储到cookies对象中，键名转换为小写以便不区分大小写比较
                cookies[key.toLowerCase()] = decodeURIComponent(value || '');
            }
            
            // 查找指定名称的cookie（不区分大小写）
            const cookieName = name.toLowerCase();
            return cookies.hasOwnProperty(cookieName) ? cookies[cookieName] : null;
          };

          const userIdKey = "user_id";
          const deviceIdKey = "device_id";

          // 取一下用户id
          // const user_id = (await cookieStore.get(userIdKey))?.value;
          const user_id = await getCookie(userIdKey);

          const setUserId = (user_unique_id) => {
            baseOpts.usid = user_unique_id;
            window.collectEvent("config", {
              user_unique_id,
            });
          };
          !!user_id && setUserId(user_id);

          // 拿一下火山的token信息
          window.collectEvent("getToken", (volcToken) => {
            window._volcToken = volcToken;
          });

          // 设备id
          // const deid = (await cookieStore.get(deviceIdKey))?.value;
          const deid = await getCookie(deviceIdKey);
          if (deid) baseOpts.deid = deid;

          // 不支持 cookieStore API 的浏览器就不执行监听了
          if (!("cookieStore" in window)) return;

          cookieStore.addEventListener("change", (event) => {
            // 新增和修改的情况
            const new_user_id = event.changed?.find(
              (item) => item.name === userIdKey
            )?.value;
            if (new_user_id) setUserId(new_user_id);
            const new_device_id = event.changed?.find(
              (item) => item.name === deviceIdKey
            )?.value;
            if (new_device_id) baseOpts.deid = new_device_id;

            // 删除的情况（退登）
            const deleted_user_id = event.deleted?.find(
              (item) => item.name === userIdKey
            );
            if (deleted_user_id) setUserId(null);
            const deleted_device_id = event.deleted?.find(
              (item) => item.name === deviceIdKey
            );
            if (deleted_device_id) baseOpts.deid = "";
          });

        } catch (error) {
        }
      })();

      // 全局埋点方法
      const sendCl = (event, opts = {}) => {
        const eventIsStr = typeof event === "string";

          ...baseOpts,

          t: Date.now(),

      const sendPv = (event, opts = {}) => {

          ...opts,

          bt: event,
        });
      };
